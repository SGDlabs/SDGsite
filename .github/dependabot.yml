version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same rule used when the dependencies were picked: only versions at least two weeks old.
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
