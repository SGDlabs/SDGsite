name: Database migrations

# Applies supabase/migrations to the production database once they reach main (the PR's CI
# already ran them on a fresh local Supabase). Never runs the seed. Needs the secrets
# SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD (docs/deploy.md); without
# them it only says so. The "production" environment can require an approval before it runs.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: production-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Push migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      HUSKY: "0"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Is production configured?
        id: production
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Production Supabase secrets are not set: no migration pushed (see docs/deploy.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.production.outputs.ready == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.production.outputs.ready == 'true'
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.production.outputs.ready == 'true'
        with:
          cache: true

      # also installs the Supabase CLI (devDependency)
      - if: steps.production.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Migrations that will run
        if: steps.production.outputs.ready == 'true'
        run: >-
          pnpm supabase db push --dry-run --skip-vault
          --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply them
        if: steps.production.outputs.ready == 'true'
        run: >-
          pnpm supabase db push --skip-vault
          --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
