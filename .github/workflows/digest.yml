name: E-mail digest

# Every hour, the site sends the "Nova atualização" e-mails that waited for a project's 2-hour
# window. A GitHub schedule works on any Vercel plan (Hobby only runs Vercel Cron once a day).
# Needs the repository secrets SITE_URL (https://…, no trailing slash) and CRON_SECRET (the same
# as in Vercel); without them it does nothing.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send pending digests
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::SITE_URL or CRON_SECRET not set; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/digest"
