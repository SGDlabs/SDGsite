name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Playwright runs on the Google Chrome that ships with the runner (channel "chrome").
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  supabase:
    name: Supabase (database, sign-in, client area, admin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      # also installs the Supabase CLI (devDependency)
      - run: pnpm install --frozen-lockfile

      # Postgres, Auth, the REST API, Realtime, Storage, the gateway and the mailbox (Mailpit): what
      # the tests use. Applies the migrations and the seed.
      - name: Start the local Supabase
        run: pnpm supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor,edge-runtime

      - name: Row level security tests against Supabase's Postgres
        run: pnpm test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Generated database types are up to date
        run: |
          pnpm --silent supabase gen types typescript --local > "$RUNNER_TEMP/database.ts"
          diff -u src/types/database.ts "$RUNNER_TEMP/database.ts"

      # The local project's URL and keys (public demo keys, not secrets) for the build and the tests.
      - name: Point the app at the local Supabase
        run: |
          eval "$(pnpm --silent supabase status -o env | grep -E '^[A-Z_]+=')"
          test -n "$API_URL" && test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            # for /api/cron/digest; e-mails are only logged (no RESEND_API_KEY)
            echo "CRON_SECRET=ci-cron-secret-$GITHUB_RUN_ID"
          } >> "$GITHUB_ENV"

      - run: pnpm build

      # the README's local walkthrough: sample prints, then the stage advance (after the tests)
      - run: pnpm db:seed-media

      - name: Sign-in, client area, admin and integration API against the local Supabase
        run: pnpm test:e2e auth client-area admin integration emails

      - name: The README's stage advance snippet works
        run: pnpm supabase db query --local -f supabase/snippets/avancar-etapa.sql

      - name: Supabase Auth and Realtime logs
        if: failure()
        run: |
          docker logs --tail 80 supabase_auth_sdg-site 2>&1 || true
          docker logs --tail 80 supabase_realtime_sdg-site 2>&1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: supabase-job
          path: |
            ${{ runner.temp }}/database.ts
            playwright-report/
          retention-days: 7
